name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # PBI-55 pos-incidente: pnpm build reproduz o build de producao (Railway
  # roda a mesma coisa). Detecta erros que typecheck nao pega — server-only
  # importado por client component, uso de Node API em client, etc.
  #
  # 5 semanas de deploys quebrados (PR #64+ ate PR #77) passaram porque
  # esse job nao existia. Turbopack (dev) e permissivo, only next build valida.
  build:
    name: Next build (prod)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      # Sem env de Sentry, o wrap continua rodando mas nao upa source maps.
      # SKIP_ENV_VALIDATION evita build quebrar caso alguem adicione validacao
      # zod de env vars obrigatorias no futuro.
      - name: Build (production)
        env:
          SKIP_ENV_VALIDATION: "true"
        run: pnpm build

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm test:run

  # Integration tests com Postgres real — PBI-13 parcial.
  # Roda RLS setup antes dos testes pra simular ambiente prod.
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: barbearia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5433/barbearia_test?schema=public
      DIRECT_URL: postgresql://postgres:test@localhost:5433/barbearia_test?schema=public
      # senha do role app_user (criado em setup-app-user.ts). Em CI é fixa
      # — o DB sobe e morre no mesmo job, não é segredo.
      APP_USER_PASSWORD: ci_app_user_password_not_secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      # app_user precisa existir ANTES das migrations rodarem, porque
      # algumas migrations fazem GRANT ... TO app_user (PBI-48 review_and_post,
      # PBI-20 customer_notes). Criar role antes, migrations depois.
      - name: Setup app_user role (RLS)
        run: pnpm tsx prisma/setup-app-user.ts

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Integration tests
        run: pnpm tsx ./node_modules/vitest/dist/cli.js run tests/integration
