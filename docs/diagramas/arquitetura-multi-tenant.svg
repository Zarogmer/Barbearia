<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .layer { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .box-title { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .meta { font-size: 11px; fill: #475569; }
      .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; fill: #1e293b; }
      .ok { font-size: 11px; font-weight: 700; fill: #15803d; }
      .err { font-size: 11px; font-weight: 700; fill: #b91c1c; }
      .pbi-tag { font-size: 11px; font-weight: 600; fill: #1d4ed8; }
    </style>
  </defs>

  <text x="40" y="48" class="title">Arquitetura Multi-tenant — Request → Postgres com RLS</text>
  <text x="40" y="70" class="subtitle">Tenant isolation em 4 camadas · falha em uma → próxima ainda barra · PBI-01 / PBI-02 / PBI-11</text>

  <!-- ============ Layer 1: Cliente ============ -->
  <rect x="40" y="100" width="1120" height="80" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="125" class="layer">1. Cliente HTTP</text>
  <g>
    <rect x="220" y="115" width="220" height="50" rx="6" fill="#ffffff" stroke="#475569"/>
    <text x="240" y="138" class="box-title">Browser (mobile/desktop)</text>
    <text x="240" y="155" class="mono">GET /barbearia-demo/agendar</text>
  </g>
  <g>
    <rect x="470" y="115" width="220" height="50" rx="6" fill="#ffffff" stroke="#475569"/>
    <text x="490" y="138" class="box-title">Admin logado</text>
    <text x="490" y="155" class="mono">cookie __Secure-next-auth</text>
  </g>
  <g>
    <rect x="720" y="115" width="220" height="50" rx="6" fill="#fef2f2" stroke="#dc2626"/>
    <text x="740" y="138" class="box-title" fill="#b91c1c">Atacante</text>
    <text x="740" y="155" class="mono" fill="#b91c1c">GET /admin/appt/&lt;outra-org&gt;</text>
  </g>

  <line x1="600" y1="180" x2="600" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Layer 2: Next.js Edge / Middleware ============ -->
  <rect x="40" y="220" width="1120" height="140" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="60" y="245" class="layer">2. Next.js App Router</text>
  <text x="60" y="262" class="meta">middleware.ts → Server Component / Server Action</text>

  <g>
    <rect x="60" y="275" width="340" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="80" y="295" class="box-title">middleware.ts</text>
    <text x="80" y="312" class="meta">→ auth() devolve Session</text>
    <text x="80" y="327" class="meta">→ rotas (admin)/* exigem login</text>
    <text x="80" y="342" class="meta">→ rotas [orgSlug]/* resolvem orgId via slug</text>
  </g>

  <g>
    <rect x="420" y="275" width="340" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="440" y="295" class="box-title">Server Action / Route Handler</text>
    <text x="440" y="312" class="mono">"use server"</text>
    <text x="440" y="327" class="meta">1) schema.parse(input)  ← Zod sempre</text>
    <text x="440" y="342" class="meta">2) role check (OWNER/STAFF) se admin</text>
  </g>

  <g>
    <rect x="780" y="275" width="340" height="70" rx="6" fill="#faf5ff" stroke="#a855f7"/>
    <text x="800" y="295" class="box-title" fill="#7e22ce">withTenant(orgId, fn)</text>
    <text x="800" y="312" class="mono">SET LOCAL app.current_org_id = '…'</text>
    <text x="800" y="327" class="mono">SET LOCAL row_security = on</text>
    <text x="800" y="342" class="meta">tudo dentro vê só dados da org</text>
  </g>

  <line x1="600" y1="360" x2="600" y2="395" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Layer 3: ORM ============ -->
  <rect x="40" y="405" width="1120" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="60" y="430" class="layer">3. Prisma Client (transação por request)</text>

  <g>
    <rect x="60" y="445" width="500" height="60" rx="6" fill="#ffffff" stroke="#16a34a"/>
    <text x="80" y="465" class="box-title">db.appointment.findMany({ where: { professionalId } })</text>
    <text x="80" y="482" class="meta">Nenhum filtro por organizationId no código —</text>
    <text x="80" y="497" class="meta">o Postgres filtra automaticamente via RLS abaixo.</text>
  </g>

  <g>
    <rect x="580" y="445" width="540" height="60" rx="6" fill="#fefce8" stroke="#ca8a04"/>
    <text x="600" y="465" class="box-title" fill="#854d0e">⚠ Regra: NUNCA confiar em orgId vindo do client</text>
    <text x="600" y="482" class="meta">orgId é derivado da Session (admin) ou do slug resolvido (público).</text>
    <text x="600" y="497" class="meta">Cliente não tem como sobrepor isso — middleware fixa antes da SA.</text>
  </g>

  <line x1="600" y1="515" x2="600" y2="550" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Layer 4: Postgres ============ -->
  <rect x="40" y="560" width="1120" height="280" rx="10" fill="#fdf4ff" stroke="#a855f7"/>
  <text x="60" y="585" class="layer">4. Postgres 16 — última linha de defesa</text>

  <!-- Roles -->
  <g>
    <rect x="60" y="600" width="220" height="220" rx="6" fill="#ffffff" stroke="#a855f7"/>
    <text x="80" y="622" class="box-title">Connection roles</text>
    <line x1="70" y1="632" x2="270" y2="632" stroke="#e2e8f0"/>
    <text x="80" y="652" class="mono" fill="#0f766e">app_user</text>
    <text x="80" y="668" class="meta">conexão da app</text>
    <text x="80" y="682" class="meta">RLS sempre ON</text>
    <line x1="70" y1="695" x2="270" y2="695" stroke="#e2e8f0"/>
    <text x="80" y="715" class="mono" fill="#9a3412">app_migrator</text>
    <text x="80" y="731" class="meta">só prisma migrate</text>
    <text x="80" y="745" class="meta">BYPASSRLS · vira owner</text>
    <line x1="70" y1="758" x2="270" y2="758" stroke="#e2e8f0"/>
    <text x="80" y="778" class="mono" fill="#b91c1c">app_superuser</text>
    <text x="80" y="794" class="meta">scripts admin only</text>
    <text x="80" y="808" class="meta">BYPASSRLS · jamais em request</text>
  </g>

  <!-- RLS Policies -->
  <g>
    <rect x="300" y="600" width="400" height="220" rx="6" fill="#ffffff" stroke="#a855f7"/>
    <text x="320" y="622" class="box-title">Row Level Security policies</text>
    <line x1="310" y1="632" x2="690" y2="632" stroke="#e2e8f0"/>
    <text x="320" y="652" class="mono">CREATE FUNCTION current_org_id() …</text>
    <text x="320" y="666" class="mono">  RETURN setting('app.current_org_id')</text>
    <line x1="310" y1="678" x2="690" y2="678" stroke="#e2e8f0"/>
    <text x="320" y="698" class="mono">ALTER TABLE services ENABLE RLS;</text>
    <text x="320" y="712" class="mono">ALTER TABLE services FORCE RLS;</text>
    <text x="320" y="730" class="mono">CREATE POLICY tenant_isolation</text>
    <text x="320" y="744" class="mono">  USING (org_id = current_org_id())</text>
    <text x="320" y="758" class="mono">  WITH CHECK (org_id = current_org_id());</text>
    <line x1="310" y1="770" x2="690" y2="770" stroke="#e2e8f0"/>
    <text x="320" y="790" class="meta">Aplicado em: services, professionals, working_hours,</text>
    <text x="320" y="804" class="meta">time_blocks, appointments, memberships, organizations</text>
  </g>

  <!-- EXCLUDE constraint -->
  <g>
    <rect x="720" y="600" width="400" height="220" rx="6" fill="#ffffff" stroke="#a855f7"/>
    <text x="740" y="622" class="box-title">EXCLUDE constraint — anti-conflito (RN-04)</text>
    <line x1="730" y1="632" x2="1110" y2="632" stroke="#e2e8f0"/>
    <text x="740" y="652" class="mono">CREATE EXTENSION btree_gist;</text>
    <line x1="730" y1="664" x2="1110" y2="664" stroke="#e2e8f0"/>
    <text x="740" y="684" class="mono">ALTER TABLE appointments ADD CONSTRAINT</text>
    <text x="740" y="698" class="mono">  no_overlap_per_professional EXCLUDE USING gist (</text>
    <text x="740" y="712" class="mono">    professional_id WITH =,</text>
    <text x="740" y="726" class="mono">    tstzrange(starts_at, ends_at, '[)') WITH &amp;&amp;</text>
    <text x="740" y="740" class="mono">  ) WHERE (status = 'CONFIRMED');</text>
    <line x1="730" y1="752" x2="1110" y2="752" stroke="#e2e8f0"/>
    <text x="740" y="772" class="meta">Race-condition proof: 2 INSERTs simultâneos →</text>
    <text x="740" y="786" class="meta">um falha com 23P01, SA traduz "slot ocupou".</text>
    <text x="740" y="808" class="pbi-tag">PBI-08 captura erro · PBI-06 evita no happy path</text>
  </g>

  <!-- Result paths -->
  <g>
    <!-- happy path arrow loops back up -->
    <path d="M 280 600 C 200 540, 200 420, 350 360" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
    <text x="100" y="468" class="ok">app_user + tenant set</text>
    <text x="100" y="482" class="ok">→ vê só sua org ✓</text>

    <!-- attacker blocked arrow -->
    <path d="M 830 220 C 1050 250, 1130 460, 900 600" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-red)"/>
    <text x="990" y="400" class="err">Atacante: ID de outra org</text>
    <text x="990" y="416" class="err">→ middleware fixa orgId da sessão</text>
    <text x="990" y="432" class="err">→ RLS rejeita: 0 rows</text>
    <text x="990" y="448" class="err">→ Route Handler retorna 404</text>
    <text x="990" y="464" class="err">  (nunca 403, não vaza existência)</text>
  </g>

  <!-- Footer -->
  <rect x="40" y="864" width="1120" height="44" rx="6" fill="#0f172a"/>
  <text x="60" y="888" fill="#f1f5f9" font-size="13" font-weight="700">Testes de isolamento (PBI-11) provam isso:</text>
  <text x="320" y="888" fill="#cbd5e1" font-size="12">cross-tenant leak E2E · query sem SET org_id → 0 rows · INSERT cross-tenant → rejeitado</text>
</svg>
