<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .step-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .step-meta { font-size: 11px; fill: #64748b; }
      .pbi-tag { font-size: 11px; font-weight: 600; fill: #1d4ed8; }
      .lbl { font-size: 12px; fill: #475569; }
      .err { font-size: 12px; fill: #b91c1c; font-weight: 600; }
      .ok { font-size: 12px; fill: #15803d; font-weight: 600; }
      .legend { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <!-- Header -->
  <text x="40" y="48" class="title">Fluxo Cliente — Agendamento (mobile-first)</text>
  <text x="40" y="70" class="subtitle">4 toques, sem login obrigatório · state via URL search params · PBIs 06 → 07 → 08</text>

  <!-- Legend -->
  <rect x="850" y="32" width="310" height="58" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="868" cy="50" r="6" fill="#2563eb"/><text x="882" y="54" class="legend">tela (RSC + URL state)</text>
  <circle cx="868" cy="72" r="6" fill="#16a34a"/><text x="882" y="76" class="legend">sucesso</text>
  <circle cx="1010" cy="50" r="6" fill="#dc2626"/><text x="1024" y="54" class="legend">erro / slot ocupado</text>
  <circle cx="1010" cy="72" r="6" fill="#a855f7"/><text x="1024" y="76" class="legend">server action</text>

  <!-- Step 1: Landing /[orgSlug] -->
  <g>
    <rect x="40" y="120" width="240" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="148" class="step-title">1. Landing pública</text>
    <text x="60" y="168" class="step-meta">GET /[orgSlug]</text>
    <text x="60" y="184" class="step-meta">Serviços + profissionais (org)</text>
    <text x="60" y="200" class="step-meta">CTA "Agendar agora"</text>
    <text x="60" y="220" class="pbi-tag">PBI-07 · W-01 · RN-14</text>
  </g>

  <!-- Arrow 1->2 -->
  <line x1="280" y1="175" x2="345" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Escolher serviço -->
  <g>
    <rect x="345" y="120" width="240" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="365" y="148" class="step-title">2. Serviço</text>
    <text x="365" y="168" class="step-meta">GET /[orgSlug]/agendar</text>
    <text x="365" y="184" class="step-meta">Lista Service.active=true</text>
    <text x="365" y="200" class="step-meta">?serviceId=… para próx</text>
    <text x="365" y="220" class="pbi-tag">PBI-07 · W-02 · RN-02</text>
  </g>

  <line x1="585" y1="175" x2="650" y2="175" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Profissional -->
  <g>
    <rect x="650" y="120" width="240" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="148" class="step-title">3. Profissional</text>
    <text x="670" y="168" class="step-meta">GET …/agendar/profissional</text>
    <text x="670" y="184" class="step-meta">Quem faz o Service +</text>
    <text x="670" y="200" class="step-meta">opção "qualquer" (RN-12)</text>
    <text x="670" y="220" class="pbi-tag">PBI-07 · W-03</text>
  </g>

  <!-- vertical down to step 4 -->
  <line x1="770" y1="230" x2="770" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Horário -->
  <g>
    <rect x="650" y="270" width="240" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="298" class="step-title">4. Data + Horário</text>
    <text x="670" y="318" class="step-meta">…/agendar/horario</text>
    <text x="670" y="334" class="step-meta">getAvailableSlots(date)</text>
    <text x="670" y="350" class="step-meta">Calendar 60d + slots 15min</text>
    <text x="670" y="370" class="pbi-tag">PBI-07/06 · W-04 · RN-03/05/06</text>
  </g>

  <!-- Step 5: Confirmar -->
  <line x1="650" y1="330" x2="585" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="345" y="270" width="240" height="120" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="365" y="298" class="step-title">5. Confirmar dados</text>
    <text x="365" y="318" class="step-meta">…/agendar/confirmar</text>
    <text x="365" y="334" class="step-meta">Form: nome, telefone, email</text>
    <text x="365" y="350" class="step-meta">Pré-preenchido se logado</text>
    <text x="365" y="370" class="pbi-tag">PBI-08 · W-05 · RN-16</text>
  </g>

  <!-- Server Action -->
  <line x1="345" y1="330" x2="280" y2="330" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="40" y="270" width="240" height="170" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="60" y="298" class="step-title" fill="#7e22ce">⚡ confirmBookingAction</text>
    <text x="60" y="320" class="step-meta">1. Zod parse</text>
    <text x="60" y="336" class="step-meta">2. Resolve org via slug</text>
    <text x="60" y="352" class="step-meta">3. Recalcula slots (anti-race)</text>
    <text x="60" y="368" class="step-meta">4. Cria User se anônimo</text>
    <text x="60" y="384" class="step-meta">5. INSERT Appointment</text>
    <text x="60" y="400" class="step-meta">   ↳ EXCLUDE constraint</text>
    <text x="60" y="416" class="step-meta">6. Resend email (best-effort)</text>
    <text x="60" y="432" class="pbi-tag" fill="#7e22ce">PBI-08 · RN-04 · RN-15</text>
  </g>

  <!-- Branches from Server Action -->
  <!-- Success -->
  <line x1="160" y1="440" x2="160" y2="490" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="170" y="468" class="ok">sucesso</text>
  <g>
    <rect x="40" y="490" width="240" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="60" y="520" class="step-title" fill="#15803d">6. Confirmação</text>
    <text x="60" y="540" class="step-meta">…/agendamento/[id]</text>
    <text x="60" y="556" class="step-meta">Status CONFIRMED</text>
    <text x="60" y="572" class="step-meta">Email enviado</text>
    <text x="60" y="588" class="step-meta">Add to calendar</text>
    <text x="60" y="606" class="pbi-tag" fill="#15803d">PBI-08 · W-06 · RN-15</text>
  </g>

  <!-- Slot ocupado -->
  <line x1="280" y1="380" x2="345" y2="380" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="293" y="372" class="err">slot ocupou (race)</text>

  <!-- Erro: race condition - volta para horário -->
  <path d="M 770 270 Q 770 230 770 230" stroke="#dc2626" stroke-width="0" fill="none"/>
  <line x1="770" y1="390" x2="770" y2="490" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="780" y="442" class="err">23P01 / P2002 →</text>
  <text x="780" y="458" class="err">"Escolha outro"</text>
  <g>
    <rect x="650" y="490" width="240" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="670" y="518" class="step-title" fill="#b91c1c">Slot ocupado</text>
    <text x="670" y="538" class="step-meta">EXCLUDE pegou race</text>
    <text x="670" y="554" class="step-meta">CTA "Voltar aos horários"</text>
  </g>
  <!-- back loop from "Slot ocupado" to step 4 -->
  <path d="M 770 490 C 850 470, 920 380, 890 330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Erro validação -->
  <line x1="465" y1="390" x2="465" y2="490" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="475" y="442" class="err">Zod field errors</text>
  <g>
    <rect x="345" y="490" width="240" height="80" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="365" y="518" class="step-title" fill="#b91c1c">Erro inline</text>
    <text x="365" y="538" class="step-meta">Mensagem perto do campo</text>
    <text x="365" y="554" class="step-meta">Sem toast (princípio UX)</text>
  </g>

  <!-- Section: Eventos pós-confirmação -->
  <rect x="40" y="660" width="1120" height="2" fill="#e2e8f0"/>
  <text x="40" y="695" class="title" style="font-size: 18px;">Após confirmação — eventos paralelos</text>

  <g>
    <rect x="40" y="715" width="260" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="58" y="740" class="step-title" fill="#1d4ed8">📧 Email cliente</text>
    <text x="58" y="760" class="step-meta">Resend · template HTML</text>
    <text x="58" y="776" class="step-meta">Data, prof, serviço, endereço</text>
    <text x="58" y="792" class="step-meta">Link de cancelamento</text>
    <text x="58" y="812" class="pbi-tag">PBI-08 · RN-15</text>
  </g>

  <g>
    <rect x="320" y="715" width="260" height="120" rx="10" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="338" y="740" class="step-title" fill="#1d4ed8">📧 Email owner da org</text>
    <text x="338" y="760" class="step-meta">Notificação curta</text>
    <text x="338" y="776" class="step-meta">"Novo agendamento: …"</text>
    <text x="338" y="812" class="pbi-tag">PBI-08 · RN-15</text>
  </g>

  <g>
    <rect x="600" y="715" width="260" height="120" rx="10" fill="#fffbeb" stroke="#d97706"/>
    <text x="618" y="740" class="step-title" fill="#92400e">🔑 Verificação email</text>
    <text x="618" y="760" class="step-meta">Se cliente novo (Credentials)</text>
    <text x="618" y="776" class="step-meta">Token 24h em /verificar</text>
    <text x="618" y="792" class="step-meta">Não bloqueia agendamento</text>
    <text x="618" y="812" class="pbi-tag" fill="#92400e">PBI-03 · RN-15</text>
  </g>

  <g>
    <rect x="880" y="715" width="260" height="120" rx="10" fill="#f0fdf4" stroke="#15803d"/>
    <text x="898" y="740" class="step-title" fill="#15803d">📅 Aparece na agenda admin</text>
    <text x="898" y="760" class="step-meta">/admin/agenda?date=…</text>
    <text x="898" y="776" class="step-meta">revalidatePath()</text>
    <text x="898" y="792" class="step-meta">Bloco colorido na coluna</text>
    <text x="898" y="812" class="pbi-tag" fill="#15803d">PBI-09</text>
  </g>

  <!-- Footer note -->
  <text x="40" y="872" class="subtitle">Antecedência mínima 30min (RN-05) · janela 60d (RN-06) · slots 15min (RN-03) · sem sobreposição garantida no DB (RN-04 + EXCLUDE)</text>
</svg>
